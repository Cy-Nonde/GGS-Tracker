name: Build Android APK

on:
  push:
    branches: [ main, master ] # Triggers whenever you push code
  workflow_dispatch: # Allows you to manually click "Run" on your phone

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Runs safely in the cloud environment

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: |
          # Replace 'npm run build' with your exact compilation command if you use Vite/Webpack.
          # If using uncompiled static files directly in public/, leave this out.
          npm run build --if-present 

      - name: Sync Capacitor Native Files
        run: |
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compile Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
