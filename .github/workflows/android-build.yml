name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Build Web Application
        run: |
          npm run build --if-present 

      - name: Force Generate Capacitor Config and Public Assets
        run: |

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.ggs.ggstracker",
            "appName": "GGS Tracker",
            "webDir": "public",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Native Platform
        run: |
          npx cap add android

      - name: Sync Capacitor Native Files
        run: |
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compile Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
