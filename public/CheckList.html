<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/styles.css">
<title>CheckList</title>

<style>
h1 {
    text-align: center;
}

.card {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
    background: #f9f9f9;
}

.locked {
    background: #fff3cd;
    color: #856404;
    padding: 15px;
    border-radius: 8px;
}

.success {
    background: #d4edda;
    color: #155724;
    padding: 15px;
    border-radius: 8px;
}

.back-btn {
    padding: 10px 20px;
    margin-bottom: 20px;
    cursor: pointer;
}

.record-title {
    font-size: 18px;
    font-weight: bold;
}

.empty {
    color: #666;
}
</style>

</head>
<body>

<button
    class="back-btn"
    onclick="window.location.href='/'">
    Back Home
</button>

<h1>Monthly CheckList Review</h1>

<div id="content">
    Loading...
</div>

<script>

async function loadChecklist() {

    const content =
        document.getElementById("content");

    try {

        const response =
            await fetch("/api/checklist");

        const data =
            await response.json();

        // Checklist locked
        if (!data.eligible) {

            content.innerHTML = `
                <div class="locked">
                    <h2>Checklist Locked</h2>

                    <p>
                        A full review becomes available
                        after one month of records.
                    </p>

                    <p>
                        Days Remaining:
                        <strong>${data.daysRemaining}</strong>
                    </p>
                </div>
            `;

            return;
        }

        let html = `
            <div class="success">
                <h2>
                    Review Available
                </h2>

                <p>
                    Current Review Month:
                    <strong>
                        ${data.currentMonth}
                    </strong>
                </p>
            </div>
            <br>
        `;

        if (!data.records ||
            data.records.length === 0) {

            html += `
                <p class="empty">
                    No records exist for Month
                    ${data.currentMonth}.
                </p>
            `;

            content.innerHTML = html;
            return;
        }

        data.records.forEach(record => {

            html += `
                <div class="card">

                    <div class="record-title">
                        ${record.drug_name}
                    </div>

                    <p>
                        <strong>Status:</strong>
                        ${record.status}
                    </p>

                    <p>
                        <strong>Notes:</strong>
                        ${record.notes || "None"}
                    </p>

                    <p>
                        <strong>Recorded:</strong>
                        ${record.created_at}
                    </p>

                </div>
            `;
        });

        content.innerHTML = html;

    }
    catch(error) {

        console.error(error);

        content.innerHTML = `
            <div class="locked">
                Failed to load checklist.
            </div>
        `;
    }
}

loadChecklist();

</script>

</body>
</html>
