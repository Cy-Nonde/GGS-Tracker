<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/styles.css">
<title>CheckList</title>

<style>
h1 {
    text-align: center;
}

.card {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
    background: #f9f9f9;
}

.locked {
    background: #fff3cd;
    color: #856404;
    padding: 15px;
    border-radius: 8px;
}

.success {
    background: #d4edda;
    color: #155724;
    padding: 15px;
    border-radius: 8px;
}

.back-btn {
    padding: 10px 20px;
    margin-bottom: 20px;
    cursor: pointer;
}

.record-title {
    font-size: 18px;
    font-weight: bold;
}

.empty {
    color: #666;
}
</style>

</head>
<body>

<button
    id="back-button"
    class="back-btn">
    Back Home
</button>

<h1>Monthly CheckList Review</h1>

<div id="content">
    Loading...
</div>

<script type="module" src="js/CheckList.js"></script>

</html>
