<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GGS TRACKER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="body">
  <!-- ============================================
       HEADER & NAVIGATION
       ============================================ -->
  <header>
    <h1>📊 GGS HOME 📊</h1>
    <nav>
      <button id="projects-btn">Projects</button>
      <button id="tasks-btn">Tasks</button>
      <button id="timeline-btn">Timeline</button>
      <button id="collaborators-btn">Collaborators</button>
      <button id="comments-btn">Comments</button>
      <button id="records-btn">Records</button>
      <button id="notifications-btn">Notifications</button>
      <button id="history-btn">History</button>
      <button id="chat-btn">Chatbot</button>
    </nav>
    <div id="status" aria-live="polite"></div>
    <div id="health" class="health-status" aria-live="polite"></div>
  </header>

  <!-- ============================================
       MAIN CONTENT AREA
       ============================================ -->
  <main id="app" role="main">
    <!-- Dynamic content rendered by JS -->

    <!-- Integrated AI Chatbot -->
    <section id="auth-section" style="display:none;">
      <h2>Login</h2>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="Username" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <label>
          <input type="checkbox" id="remember-me" /> Remember Me
        </label>
        <button type="submit">Login</button>
      </form>

      <h2>Register</h2>
      <form id="register-form">
        <input type="text" id="register-username" placeholder="Username" required />
        <input type="password" id="register-password" placeholder="Password" required />
        <button type="submit">Register</button>
      </form>
    </section>

    <section id="chat-section" style="display:none;">
      <h2>Chat</h2>
      <div id="chat-window" class="chat-window"></div>
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Type a message..." required />
        <button type="submit">Send</button>
      </form>

      <div class="mode-controls">
        <label for="mode-select">Mode:</label>
        <select id="mode-select">
          <option value="default">Default</option>
          <option value="study">Study</option>
          <option value="shopping">Shopping</option>
          <option value="productivity">Productivity</option>
        </select>
        <button id="save-mode">Save Mode</button>
      </div>

      <button id="clear-history">Clear History</button>
    </section>

    <section id="profile-section" style="display:none;">
      <h2>Change Password</h2>
      <form id="password-form">
        <input type="password" id="old-password" placeholder="Old Password" required />
        <input type="password" id="new-password" placeholder="New Password" required />
        <button type="submit">Change Password</button>
      </form>
    </section>

    <section id="extras-section" style="display:none;">
      <button id="toggle-dark">Toggle Dark Mode</button>
      <button id="logout-btn">Logout</button>
    </section>

    <!-- ============================================
         EXTRA FEATURE WINDOWS
         ============================================ -->
    <section id="notifications-window"></section>
    <section id="records-window"></section>
    <section id="timeline-window"></section>
    <section id="collaborators-window"></section>
    <section id="comments-window"></section>
    <section id="history-window"></section>
  </main>

  <!-- ============================================
       FOOTER
       ============================================ -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 CSC4004</p>
      <p>Cyrus Nonde - 2020893536</p>
      <p>GGS TRACKER</p>
    </div>
  </footer>

  <!-- ============================================
       SCRIPTS
       ============================================ -->
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
